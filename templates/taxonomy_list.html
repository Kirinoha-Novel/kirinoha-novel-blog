{% extends "base.html" %} {% block content %}
<main>
  <h1 class="title">タグ一覧</h1>
  <ul class="posts">
    {% for term in terms %}
    <li class="paper">
      <h2 class="card-title"><a href="{{ term.permalink | escape }}">#{{ term.name }}</a></h2>
      <p class="meta">{{ term.page_count }} 記事</p>
    </li>
    {% endfor %}
  </ul>
</main>
{% endblock content %}
