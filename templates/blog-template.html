{% extends "base.html" %} {% block content %}
<main class="article">
  <article>
    <h1 class="title">{{ page.title }}</h1>
    {% include "meta.html" %} {% include "tags.html" %}
    {#- task list checkboxes from Markdown get a name for screen readers -#}
    <div class="content">{{ page.content | replace(from='<input disabled="" type="checkbox"', to='<input disabled="" type="checkbox" aria-label="チェック項目"') | safe }}</div>
  </article>
  {% if page.toc %}
  <nav class="toc" aria-label="目次">{{ <toc headers={page.toc} /> }}</nav>
  {% endif %}
</main>
{% endblock content %}
