name: deploy

permissions:
  contents: read

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Install Nix
      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      # Build (config.toml with the production URL)
      - name: Build
        run: nix develop --command bash -c "zola build --base-url https://blog.kirinohanovel.com"
      # Deploy Production to Cloudflare Workers
      - name: Deploy Production to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.165.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

